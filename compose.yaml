# Cyber Security News Powered by AI
#
#   cp .env.example .env        # then set ANTHROPIC_API_KEY (optional) and the IP to publish on
#   docker compose up -d --build
#   open http://192.168.3.100:8000
#
# Collected news is stored on the host in ./data/pulse.db — the same database that
# `python3 server.py` uses — so it survives `docker compose down`, rebuilds, image
# updates and even `docker compose down -v`. Back it up by copying that folder, or with:
#   docker compose exec pulse python server.py --backup /app/data/backup.db
name: cyber-intel-pulse

services:
  pulse:
    build: .
    image: cyber-intel-pulse:3.4.0
    container_name: cyber-intel-pulse
    restart: unless-stopped
    # Run as the owner of ./data (your login user) so the database files stay yours.
    user: "${PULSE_UID:-1000}:${PULSE_GID:-1000}"
    ports:
      # Publish only on the LAN interface (not on every interface of the host).
      - "${PULSE_BIND_IP:-192.168.3.100}:${PULSE_PORT:-8000}:8000"
    env_file:
      - path: .env        # ANTHROPIC_API_KEY, PULSE_MODEL, PULSE_AI ...
        required: false
    environment:
      # Host names/IPs browsers may use to reach the app (DNS-rebinding protection).
      PULSE_ALLOWED_HOSTS: "${PULSE_BIND_IP:-192.168.3.100},${PULSE_EXTRA_HOSTS:-}"
      PULSE_DB: /app/data/pulse.db
      PULSE_STORAGE_LABEL: "host folder ${PULSE_DATA_DIR:-./data} (Docker bind mount)"
    volumes:
      # Persistent storage: a host folder, not a Docker-managed volume.
      - type: bind
        source: ${PULSE_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: true
      # Use the host's time zone so the daily automatic refresh (default 02:00) runs at
      # local time, not UTC.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    # Give a running refresh time to finish and the database time to flush on stop.
    stop_grace_period: 30s
    # Hardening: read-only image filesystem, no extra privileges or capabilities.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
